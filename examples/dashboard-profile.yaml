# Copy this file into the consuming Home Assistant repository and customise it.
# It records deliberate responsive-layout choices; it is not loaded by Home Assistant.
# Schema: schemas/dashboard-profile.schema.json
profile_version: 2
style: calm_operational
layout_type: sections
mobile_first: true

# Progressive enhancement: phone defines task order; wider views enhance it.
responsive_contract:
  preserve_task_order_across_breakpoints: true
  allow_stretching_sparse_phone_cards: false
  allow_avoidable_structural_gaps: false
  desktop_quality_required: true

# Default validation matrix — override widths per installation if needed.
viewport_validation:
  small_phone:
    width_px: 360
    required_outcome: one_column_hierarchy_usable_controls_no_clipping
  typical_phone:
    width_px_range: [390, 430]
    required_outcome: comfortable_card_and_control_sizing
  tablet:
    width_px_range: [768, 1024]
    required_outcome: intentional_use_of_additional_width
  desktop:
    width_px: 1280
    required_outcome: balanced_layout_without_major_holes
  wide_desktop:
    width_px_range: [1440, 1920]
    required_outcome: purposeful_columns_or_deliberate_max_width

sections_policy:
  max_columns:
    phone: 1
    tablet: 2
    desktop: 2
    wide_desktop: 3
  dense_section_placement: true
  dense_placement_rationale: >
    Shorter operational sections may share a desktop row beside taller neighbours
    to reclaim empty columns without changing mobile task order.
  max_content_width_px: 1600
  permitted_section_spans: [1, 2, "full"]
  full_width_sections:
    - analytics
    - history
  expected_mobile_stacking_order:
    - status
    - primary_controls
    - secondary_status
    - analytics
    - history
  expected_desktop_grouping:
    - row: [status, secondary_status]
    - row: [primary_controls]
    - row: [analytics]
    - row: [history]

visual_confirmation:
  require_normal_dashboard_mode: true
  require_authenticated_human_when_agent_cannot_inspect_frontend: true
  material_layout_changes_require_named_confirmer: true
  conditional_states_requiring_visual_checks:
    - empty_state
    - warning_state
    - unavailable_entities
  report_must_include:
    - actual_viewport_widths_checked
    - normal_mode_used
    - layout_and_reading_order_per_width
    - clipping_overflow_gaps_awkward_spans
    - conditional_states_tested
    - visual_confirmer

targets:
  phone:
    minimum_width: 360
    columns: 1
  tablet:
    minimum_width: 768
    columns: 2
  desktop:
    minimum_width: 1280
    columns: 2

tokens:
  spacing_unit_px: 4
  grid_gap_px: 16
  card_radius_px: 12
  control_radius_px: 10
  minimum_touch_target_px: 44

interactions:
  tap: common_safe_action_or_more_info
  hold: documented_secondary_or_consequential_action
  double_tap: disabled

custom_cards:
  policy: native_first
  allowed: []

views:
  overview: [exceptions, presence_security, rooms, climate_energy, low_priority]
  room: [header_environment, frequent_controls, media_climate, covers, diagnostics]
  security: [armed_state, exceptions, locks_entries, cameras, recent_events]
  system: [failures, degraded, batteries, updates, backups, storage, diagnostics]

content_hygiene:
  forbid_in_ordinary_operational_cards:
    - github_issue_or_pr_references
    - internal_entity_ids
    - internal_automation_script_helper_names
    - implementation_notes
    - debugging_comments
    - model_mechanics
    - source_code_terminology
    - historical_development_explanations
  retain_when_needed_for_safe_operation:
    - meaningful_uncertainty
    - stale_data_warnings
    - safety_information
    - trust_provenance
    - why_automation_cannot_act

# Worked example: analytical view with phone stack + two-column desktop enhancement.
example_view:
  path: temperature_analytics
  page_header:
    title: "The Temperature Tally"
    subtitle: "Tracking highs and lows, inside and out"
    pills:
      - label: Bedroom
        value_role: room_temperature
      - label: Outside
        value_role: outdoor_temperature
      - label: Humidity
        value_role: indoor_humidity
      - label: Updated
        value_role: last_update
  mobile_stacking_order:
    - page_header
    - headline_status
    - key_controls
    - secondary_chips
    - forecast_graph
    - history_graph
  desktop:
    max_columns: 2
    dense_section_placement: true
    rows:
      - sections: [page_header]
        column_span: full
        note: centred title + wrapping pills; compact on desktop
      - sections: [headline_status, secondary_chips]
        note: shorter operational sections share a row
      - sections: [key_controls]
      - sections: [forecast_graph]
        column_span: full
        note: deliberate full-width analytical band
      - sections: [history_graph]
        column_span: full
  validation_widths_px: [390, 1280]
  must_not_appear_in_cards:
    - "(#248)"
    - entity_id_literals

# Illustrative Lovelace-shaped snippet (non-normative). Prefer native cards;
# Mushroom title/chips are acceptable only when listed in custom_cards.allowed.
example_page_header_cards:
  goal: Centred characterful title with wrapping relevant pills
  rule_ids: [HA-UX-019, HA-DESIGN-009, HA-UX-018, HA-TEST-016]
  native_shaped:
    - type: heading
      heading: The Temperature Tally
      heading_style: title
      subheading: Tracking highs and lows, inside and out
    - type: markdown
      content: >
        Compact pill/chip row goes here using the installation's established
        chip, badge, or entity-button pattern — keep centred and wrapping.
  mushroom_shaped_when_allowed:
    - type: custom:mushroom-title-card
      title: "🌡️ The Temperature Tally"
      alignment: center
      subtitle: Tracking highs and lows, inside and out
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
        - type: entity
          entity: sensor.example_bedroom_temperature
          content_info: state
          icon: mdi:thermometer
        - type: entity
          entity: sensor.example_outdoor_temperature
          content_info: state
          icon: mdi:home-thermometer-outline
        - type: entity
          entity: sensor.example_humidity
          content_info: state
          icon: mdi:water-percent

exceptions: []

# Preferred visual signature: characterful title + relevant status pills (HA-UX-019).
page_header:
  mode: preferred  # preferred | required | optional | disabled
  title_style: characterful_centred
  subtitle_policy: optional_when_useful
  pill_count_guidance: typically_2_to_5
  pill_selection: page_purpose_at_a_glance
  forbid_decorative_or_symmetric_only_pills: true
  forbid_implementation_debris_in_pills: true
  max_header_vertical_dominance_on_phone: compact
  desktop_pill_group: centred_compact_not_full_bleed
  safety_critical_language: clear_not_joking
  implementations_allowed_examples:
    - native_heading_plus_chip_or_badge_row
    - mushroom_title_and_chips_when_profile_allows
  notes: >
    Preserve personality in titles. Select pills for the page purpose; do not
    hard-code household-specific entities into the handbook.
