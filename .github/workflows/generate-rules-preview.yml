name: Render proposed handbook rules

on:
  pull_request:
    paths:
      - "handbook/**"
      - "scripts/rules.py"
      - ".github/workflows/generate-rules-preview.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate rule output
        run: |
          python scripts/rules.py generate
          python scripts/rules.py check
      - uses: actions/upload-artifact@v4
        with:
          name: generated-handbook-rules
          path: generated/
          include-hidden-files: true
          if-no-files-found: error
