name: Validate handbook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate rules and generated files
        run: python scripts/rules.py check
      - name: Test rule tooling
        run: python -m unittest discover -s tests
