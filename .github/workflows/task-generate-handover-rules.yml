name: Temporary task rule generation

on:
  push:
    branches: [docs/ai-handover-discovery-20261024]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/rules.py generate && python scripts/rules.py check
      - name: Commit generated files to the task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if ! git diff --cached --quiet; then
            git commit -m "docs(ai): generate handover discovery rule outputs"
            git push origin HEAD:refs/heads/docs/ai-handover-discovery-20261024
          fi
